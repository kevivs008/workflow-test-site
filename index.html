<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Nama Bayi Islami — NamaBayiIslami (Tes)</title>
<meta name="description" content="Situs uji: pencari nama bayi islami dengan filter.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<a class="brand" href="/">Nama<span>Bayi</span>Islami <small>&middot; situs tes</small></a>
<nav>
<a href="/">Cari Nama</a>
<a href="/rangkaian">Rangkaian</a>
<a href="/artikel/">Artikel</a>
<a href="/metodologi">Metodologi</a>
</nav>
</header>
<main>
<h1>Cari Nama Bayi Islami</h1>
<p class="meta">Situs tes alur kerja — hanya 8 nama contoh. Ketik untuk mencari, atau gunakan filter.</p>
<div class="controls">
  <input id="q" type="search" placeholder="Cari nama atau arti…">
  <select id="gender">
    <option value="all">Semua gender</option>
    <option value="laki-laki">Laki-laki</option>
    <option value="perempuan">Perempuan</option>
  </select>
  <select id="letter">
    <option value="all">Semua huruf</option>
    <option>A</option><option>B</option><option>F</option><option>H</option>
    <option>K</option><option>M</option><option>Z</option>
  </select>
</div>
<p class="count" id="count"></p>
<div class="grid" id="results"></div>
<script>
const NAMES = [{"latin": "Aisyah", "arabic": "عَائِشَة", "gender": "perempuan", "arti": "yang hidup, bersemangat", "source": "Sahabiyah (istri Nabi Muhammad ﷺ)", "theme": "kehidupan", "nick": ["Aya", "Icha", "Syah"]}, {"latin": "Amir", "arabic": "أَمِير", "gender": "laki-laki", "arti": "pemimpin, pangeran", "source": "Nama Arab klasik", "theme": "kepemimpinan", "nick": ["Mir", "Ami"]}, {"latin": "Bilal", "arabic": "بِلَال", "gender": "laki-laki", "arti": "air segar, kelembapan", "source": "Sahabat (muadzin Nabi ﷺ)", "theme": "kesalehan", "nick": ["Bil"]}, {"latin": "Fatimah", "arabic": "فَاطِمَة", "gender": "perempuan", "arti": "menahan diri, suci", "source": "Putri Nabi Muhammad ﷺ", "theme": "kesalehan", "nick": ["Fima", "Timah", "Ita"]}, {"latin": "Hamzah", "arabic": "حَمْزَة", "gender": "laki-laki", "arti": "kuat, singa", "source": "Sahabat (paman Nabi ﷺ)", "theme": "keberanian", "nick": ["Ham", "Zah"]}, {"latin": "Khadijah", "arabic": "خَدِيجَة", "gender": "perempuan", "arti": "perintis, yang terpercaya", "source": "Istri pertama Nabi ﷺ", "theme": "keimanan", "nick": ["Dija", "Khadi"]}, {"latin": "Maryam", "arabic": "مَرْيَم", "gender": "perempuan", "arti": "yang dicintai, beribadah", "source": "Qur'an (Surah Maryam)", "theme": "keimanan", "nick": ["Mary", "Yam"]}, {"latin": "Zaid", "arabic": "زَيْد", "gender": "laki-laki", "arti": "yang bertumbuh, tambahan", "source": "Sahabat (anak angkat Nabi ﷺ)", "theme": "pertumbuhan", "nick": ["Zai"]}];
const q=document.getElementById('q'),g=document.getElementById('gender'),l=document.getElementById('letter'),out=document.getElementById('results');
function card(n){
  return '<a class="card" href="/arti-nama/'+n.latin.toLowerCase()+'.html">'+
    '<div class="ar">'+n.arabic+'</div>'+
    '<div><strong>'+n.latin+'</strong> <span class="g">('+n.gender+')</span></div>'+
    '<div class="a">'+n.arti+'</div>'+
    '<span class="badge">'+n.theme+'</span></a>';
}
function render(){
  const s=q.value.trim().toLowerCase();
  const list=NAMES.filter(n=>
    (!s||n.latin.toLowerCase().includes(s)||n.arti.toLowerCase().includes(s))&&
    (g.value==='all'||n.gender===g.value)&&
    (l.value==='all'||n.latin[0]===l.value));
  out.innerHTML=list.length?list.map(card).join(''):'<p class="empty">Tidak ada nama yang cocok. Coba ubah filter.</p>';
  document.getElementById('count').textContent=list.length+' nama ditemukan';
}
q.addEventListener('input',render);g.addEventListener('change',render);l.addEventListener('change',render);
render();
</script>
</main>
<footer><p>Situs uji untuk latihan alur kerja (GitHub &rarr; Cloudflare Pages). Bukan situs produksi.</p></footer>
</body>
</html>
